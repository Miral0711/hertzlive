services:
  postgres:
    image: postgres:16-alpine
    container_name: archos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archos
      POSTGRES_PASSWORD: archos
      POSTGRES_DB: archos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
